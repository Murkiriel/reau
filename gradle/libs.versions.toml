# Tool and library versions are pinned here: the dash code was tested against them. protobuf and conscrypt were first the ones OpenCfMoto's Android Auto
# receiver was tested against (its gradle/libs.versions.toml, commit 0abbe2a: 3.25.1 and 2.5.3); they moved on 30/10/2026 (plan 20), each with its reason below.
# Do not bump on a lint hint.
[versions]
agp = "9.2.1"
kotlin = "2.2.10"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
composeBom = "2026.02.01"
# 4.x: the 3.x line is out of support on 31/03/2027. The classes REau has are generated by protoc 3.25.1, and a 4.x runtime reads that gencode
# (the `aa` tests pass on it, and the real Android Auto did in the lite edition, which ran it first). Plan 20, item 3.
protobuf = "4.33.6"
# 2.6.1: the 2.5.3 native library does not load on a phone with 16 KB pages (scripts/elf_16kb_check.py, run by apk_audit.py), 2.6.x's does. The real
# Android Auto accepted it in the lite edition, which ran it first. Not 2.7+: it offers a post-quantum group by default (see aa/TlsGroups.kt). Plan 20, item 1.
conscrypt = "2.6.1"
detekt = "1.23.8"
# Coverage-guided fuzzing of the byte parsers, in the JVM unit tests only (never in an APK): Jazzer 0.30.0 (Apache-2.0, 24/02/2026) runs on JUnit 5, so the
# unit tests run on the JUnit Platform with the vintage engine for the JUnit 4 ones.
jazzer = "0.30.0"
junitBom = "5.11.4"
# Coverage of the JVM unit tests (`./gradlew :app:koverHtmlReportDebug`, see CONTRIBUTING); a Gradle plugin of the build, never in an APK.
kover = "0.9.11"
# The macrobenchmark module (`:macrobenchmark`: the startup time and the baseline profile generator); it runs on a device and is never in an APK.
macrobenchmark = "1.5.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
# collectAsStateWithLifecycle: a state flow read by a screen stops being collected while the app is in the background. Same version as the line above
# (the same atomic group, so the build brings both to one number); only the catalog's pin.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# The Android Auto wire messages are protobuf (the generated classes come with the receiver).
protobuf-java = { group = "com.google.protobuf", name = "protobuf-java", version.ref = "protobuf" }
# The TLS engine the Android Auto handshake runs on.
conscrypt-android = { group = "org.conscrypt", name = "conscrypt-android", version.ref = "conscrypt" }
# Static analysis, run as a stand-alone CLI by the `detekt` task (app/build.gradle.kts); never part of the APK.
detekt-cli = { group = "io.gitlab.arturbosch.detekt", name = "detekt-cli", version.ref = "detekt" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junitBom" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
jazzer-junit = { group = "com.code-intelligence", name = "jazzer-junit", version.ref = "jazzer" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "macrobenchmark" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-test = { id = "com.android.test", version.ref = "agp" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
