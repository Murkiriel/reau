# Integração contínua do REau: roda a cada pull request e a cada push na main.
# Só verifica: não assina nada, não publica nada e não usa segredo nenhum. Sem emulador e sem testes instrumentados
# (esses precisam de aparelho e ficam para a máquina do mantenedor).
#
# Actions de terceiros: todas FIXADAS PELO COMMIT (SHA completo, com a versão exata no comentário). Uma tag de versão
# pode ser movida por quem controla o repositório da action; o SHA não. Só há actions oficiais da GitHub (actions/*),
# e o cache do Gradle vem do próprio actions/setup-java, então nenhuma action de terceiros de verdade entra aqui.
# Para atualizar, trocar o SHA e o comentário juntos, depois de ler as notas da versão.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Permissão mínima para tudo: só ler o código. Cada job herda isto e nenhum pede mais.
permissions:
  contents: read

# Uma execução nova do mesmo PR cancela a anterior que ainda estiver rodando. Na main não cancela: cada commit
# mantém o seu resultado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Sem daemon nem barra de progresso: o runner é descartável e o log fica legível.
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain

jobs:
  verificacao:
    name: Testes, lint e detekt
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: JDK 21 (Temurin) com cache do Gradle
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # O SDK do Android já vem instalado no runner do GitHub (ANDROID_HOME) com as licenças aceitas; o Gradle baixa
      # a plataforma que faltar. Este passo só confere que está lá.
      - name: Conferir o Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:?o runner deveria trazer o Android SDK}"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Testes unitários (as duas edições)
        run: ./gradlew --console=plain --max-workers=2 :app:testDebugUnitTest

      - name: Lint (as duas edições; qualquer aviso falha)
        run: ./gradlew --console=plain --max-workers=2 :app:lintDebug

      # detekt é a CLI do detekt 1.23.8 (versão em gradle/libs.versions.toml), chamada pela tarefa :app:detekt de
      # app/build.gradle.kts com config/detekt/detekt.yml e config/detekt/baseline.xml: falha em achado fora da baseline.
      - name: detekt
        run: ./gradlew --console=plain --max-workers=2 :app:detekt

      # Os testes instrumentados não rodam aqui (precisam de aparelho), mas têm de compilar: um erro de compilação neles já
      # passou despercebido (a ordem dos parâmetros de DashCompositor.setOutput), porque nenhuma outra tarefa os compila.
      - name: Compilar os testes instrumentados
        run: ./gradlew --console=plain --max-workers=2 :app:assembleAndroidTest

      - name: Guardar os relatórios se algo falhou
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: relatorios-verificacao
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 7

  auditoria-apk:
    name: Auditoria dos APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: JDK 21 (Temurin) com cache do Gradle
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Testes do próprio script de auditoria: só biblioteca padrão do Python, SDK trocado por falsos, sem emulador.
      - name: Testes do script de auditoria
        run: python3 -B -m unittest discover -s scripts -p "test_apk_audit.py" -v

      # A linha de base (scripts/apk_audit_baseline.json) é a do APK de produção. O build "release" do projeto sai
      # assinado com a chave de debug que o próprio Android Gradle Plugin cria no runner (não há keystore nem segredo
      # no repositório; sem a chave do projeto o build só assina assim com -PreauDebugSigned=true); o APK não é
      # publicado nem guardado, só inspecionado.
      - name: Montar o APK release
        run: ./gradlew --console=plain --max-workers=2 -PreauDebugSigned=true :app:assembleRelease

      # Sai com 1 se aparecer permissão, biblioteca, .so ou host que a linha de base não tem, ou se o APK não tiver a forma de
      # release (depurável, classe de debug ou do Compose tooling/test, componente fora da lista de apk_audit.py, sem perfil de base).
      - name: Auditar o APK
        run: python3 -B scripts/apk_audit.py app/build/outputs/apk/release/app-release.apk

  python:
    name: Testes do Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # O Pillow vem primeiro: o gerador de ícone e o `bench` (bench/reduce.py) o usam. Versão e hashes fixados em
      # scripts/requirements.txt, instalado numa pasta à parte (o Python do sistema não aceita pip direto) e sem dependências.
      - name: Pillow (versão e hashes fixados)
        run: python3 -m pip install --target "$RUNNER_TEMP/pylibs" --require-hashes --no-deps -r scripts/requirements.txt

      # O Python do runner (3.12 no ubuntu-24.04). Os testes de scripts/ só usam a biblioteca padrão; os de bench/ e scripts/icon, o Pillow.
      - name: Testes dos scripts (leitor de registros, auditoria de APK, redução, ícone, emulador)
        env:
          PYTHONPATH: ${{ runner.temp }}/pylibs
        run: |
          for dir in scripts scripts/registro scripts/dev bench scripts/emu scripts/icon; do
            echo "== $dir"
            (cd "$dir" && python3 -B -m unittest discover -p "test_*.py" -v)
          done

  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Versão e SHA-256 do binário fixados aqui (o SHA-256 confere com o gitleaks_8.30.1_checksums.txt da própria release).
      # Para atualizar: trocar os dois juntos, depois de ler as notas da versão.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Baixar o código
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Baixar o gitleaks (conferindo o SHA-256)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"

      # Os arquivos do checkout (sem o histórico: um clone raso não o tem inteiro). Sai com 1 se achar algo fora da lista de
      # exceções de .gitleaks.toml; --redact não escreve o valor no log.
      - name: Procurar segredos
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --config .gitleaks.toml --no-git --redact --no-banner'
